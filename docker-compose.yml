# Local full stack:  cp .env.docker.example .env  &&  docker compose up --build
#   web -> http://localhost:8080      api -> http://localhost:5000/api/health
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/resume-builder
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (64 hex chars)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      FREE_TIER_DAILY_AI_LIMIT: ${FREE_TIER_DAILY_AI_LIMIT:-10}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLIENT_URL: http://localhost:8080
    mem_limit: 512m   # same ceiling as Render's free tier, to catch memory problems early

  web:
    build:
      context: ./client
      args:
        # Baked in at build time; the *browser* calls this, so it must be reachable from your machine
        VITE_API_URL: http://localhost:5000/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:8080"]
    environment:
      PORT: "8080"

volumes:
  mongo-data:
