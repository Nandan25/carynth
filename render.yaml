# Render Blueprint (FREE plan): API as a Docker web service, frontend as a Static Site.
# New + > Blueprint > pick this repo. Service names become subdomains and must be
# globally unique; if you rename them, update the URLs below accordingly.
#
# Order of operations (each service needs the other's public URL):
#   1. Create the Blueprint. When prompted, fill in the secrets. For CLIENT_URL and
#      VITE_API_URL use the URLs the services WILL get (https://<service-name>.onrender.com).
#   2. VITE_API_URL is baked into the frontend at build time. If you change it later,
#      trigger a manual redeploy of resume-builder-web.
services:
  - type: web
    name: resume-builder-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI              # Atlas URI. Atlas > Network Access must allow 0.0.0.0/0 (Render free has no fixed IP)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY         # MUST be 64 hex chars (Render's generateValue is not hex):
        sync: false                 #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FREE_TIER_DAILY_AI_LIMIT
        value: "10"
      - key: CLIENT_URL             # exact frontend origin, NO trailing slash (CORS compares strings)
        sync: false
      - key: GOOGLE_CLIENT_ID       # optional
        sync: false
      - key: GOOGLE_CLIENT_SECRET   # optional
        sync: false

  # Frontend is a Render Static Site (no Docker): Render runs the build and serves ./client/dist.
  - type: web
    name: resume-builder-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL           # e.g. https://resume-builder-api.onrender.com/api (inlined at build time)
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID  # optional; same value as the API's GOOGLE_CLIENT_ID
        sync: false
    routes:
      # BrowserRouter needs this, otherwise refreshing /editor/123 or /settings returns 404
      - type: rewrite
        source: /*
        destination: /index.html
